name: hikaya crates

# Tests, lints and dependency checks for Hikaya's own Rust crates. These have
# no Tauri or native dependencies, so the job needs no system packages.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "hub/**"
      - "src/hikaya/**"
      - ".github/workflows/hikaya.yml"
  pull_request:
    paths:
      - "crates/**"
      - "hub/**"
      - "src/hikaya/**"
      - ".github/workflows/hikaya.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: hikaya-core
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/hikaya-core
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates/hikaya-core -> target"

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  hub:
    name: hikaya-hub
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # SQLCipher and OpenSSL are built from source; the cache keeps that to
      # the first run.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "hub -> target"

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  frontend:
    name: hikaya frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test:hikaya

  deny:
    name: licenses and advisories
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate: [crates/hikaya-core, hub]
    steps:
      - uses: actions/checkout@v5

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.crate }}/Cargo.toml
          command: check
          arguments: --config crates/hikaya-core/deny.toml
