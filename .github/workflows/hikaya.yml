name: hikaya crates

# Tests, lints and dependency checks for Hikaya's own Rust crates. These have
# no Tauri or native dependencies, so the job needs no system packages.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "hub/**"
      - ".dockerignore"
      - "src/hikaya/**"
      - "src/components/hikaya/**"
      - "tests/hikaya/**"
      - ".github/workflows/hikaya.yml"
  pull_request:
    paths:
      - "crates/**"
      - "hub/**"
      - ".dockerignore"
      - "src/hikaya/**"
      - "src/components/hikaya/**"
      - "tests/hikaya/**"
      - ".github/workflows/hikaya.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: hikaya-core
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/hikaya-core
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates/hikaya-core -> target"

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  capture:
    name: hikaya-capture (Linux and Windows)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/hikaya-capture
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates/hikaya-capture -> target"

      - name: System libraries (ALSA headers for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy (Linux)
        run: cargo clippy --all-targets --locked -- -D warnings

      # The WASAPI loopback path only compiles for Windows; checking it here
      # catches type errors without a Windows machine.
      - name: Clippy (Windows)
        run: cargo clippy --locked --target x86_64-pc-windows-msvc -- -D warnings

  hub:
    name: hikaya-hub
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # SQLCipher and OpenSSL are built from source; the cache keeps that to
      # the first run.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "hub -> target"

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  hub-image:
    name: hikaya-hub image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -f hub/Dockerfile -t hikaya-hub:ci .

      - name: Smoke test
        run: |
          # Created first, or Docker makes it root-owned and the hub cannot write.
          mkdir -p "$RUNNER_TEMP/hub"
          docker run -d --name hub --read-only --cap-drop ALL --tmpfs /tmp \
            -v "$RUNNER_TEMP/hub:/data" --user "$(id -u):$(id -g)" -p 127.0.0.1:8787:8787 hikaya-hub:ci
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8787/api/status && break; sleep 1; done
          curl -fs http://127.0.0.1:8787/api/status | grep -q '"uninitialized"'
          curl -fs -X POST http://127.0.0.1:8787/api/init -H 'content-type: application/json' \
            -d '{"passphrase":"ci smoke test passphrase"}' | grep -q '"unlocked"'
          docker restart hub
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8787/api/status && break; sleep 1; done
          curl -fs http://127.0.0.1:8787/api/status | grep -q '"locked"'

      - name: Logs
        if: failure()
        run: docker logs hub

  hub-web:
    name: hikaya-hub web viewer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "hub -> target"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: Build the hub
        working-directory: hub
        run: cargo build --locked

      - name: Viewer tests (real hub, iPhone-sized screen)
        run: bunx playwright test -c hub/web/playwright.config.ts --trace off

  frontend:
    name: hikaya frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test:hikaya

  deny:
    name: licenses and advisories
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate: [crates/hikaya-core, crates/hikaya-capture, hub]
    steps:
      - uses: actions/checkout@v5

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.crate }}/Cargo.toml
          command: check
          arguments: --config ${{ matrix.crate }}/deny.toml
