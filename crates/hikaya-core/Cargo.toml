[package]
name = "hikaya-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Platform-independent logic for Hikaya: text cleanup, replacement rules and correction mining."
repository = "https://github.com/Ahmed-Berrada/hikaya"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
similar = "2"

[dev-dependencies]
proptest = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
