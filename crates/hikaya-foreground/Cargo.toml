[package]
name = "hikaya-foreground"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Which app has the keyboard, so Hikaya knows where dictated text goes (Windows; unknown elsewhere)."
repository = "https://github.com/Ahmed-Berrada/hikaya"
publish = false

[dependencies]
hikaya-core = { path = "../hikaya-core" }

# The same version the desktop app already uses.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61.3"
features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"
