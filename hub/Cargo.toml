[package]
name = "hikaya-hub"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Self-hosted hub for Hikaya: the encrypted archive, device sync and background jobs."
repository = "https://github.com/Ahmed-Berrada/hikaya"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
