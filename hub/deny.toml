# cargo-deny configuration for the hub.
[advisories]
yanked = "deny"

[licenses]
# "blessing" is SQLite's public-domain dedication and WTFPL covers libtomcrypt;
# both come with the bundled SQLCipher sources.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "blessing", "WTFPL"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies (hikaya-core) have no version; that is fine for an
# unpublished crate.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
